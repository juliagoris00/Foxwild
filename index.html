<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lille Games</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12071f;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px} .wrap{max-width:760px;width:100%;text-align:center} h1{font-size:clamp(2rem,8vw,4rem);margin:0 0 8px} p{opacity:.82;font-size:1.1rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:28px}.card{display:block;text-decoration:none;color:white;background:linear-gradient(135deg,#24103d,#4b1568);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.35)} .card strong{display:block;font-size:1.45rem;margin-bottom:8px}.card span{opacity:.78}.admin{margin-top:22px;font-size:.95rem;opacity:.8}code{background:rgba(255,255,255,.12);padding:3px 7px;border-radius:8px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>🍻 Lille Games</h1>
    <p>Kies je spel voor onderweg of tijdens de pubcrawl.</p>
    <div class="cards">
      <a class="card" href="bingo/"><strong>🍺 Bar Crawl Bingo</strong><span>Bingokaart met live scorebord.</span></a>
      <a class="card" href="rumble/"><strong>🎭 Rijsel Rumble</strong><span>Wie-van-ons spel voor de auto’s.</span></a>
    </div>
    <p class="admin">Hostpagina’s: <code>/bingo/admin.html</code> en <code>/rumble/admin.html</code></p>
  </main>
</body>
</html>
